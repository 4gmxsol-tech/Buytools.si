name: Site quality checks
on:
  push:
    branches: [main, feat/seo-responsive-monetization]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Set up Node.js for inline script validation
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate site structure, SEO, links and JavaScript
        run: python scripts/check_site.py
      - name: Test internal fragment validation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
