name: Site quality checks
on:
  push:
    branches: [main, feat/seo-responsive-monetization]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate HTML metadata and sitemap targets
        run: python scripts/check_site.py
