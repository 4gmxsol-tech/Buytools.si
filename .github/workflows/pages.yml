name: Deploy BuyTools.si to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate required static files
        run: |
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          grep -q '<title>.*BuyTools.si' index.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          check_url() {
            local path="$1"
            local expected="$2"
            local body
            body="$(mktemp)"
            echo "Checking ${SITE_URL}${path}"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-connrefused \
              "${SITE_URL}${path}" --output "$body"
            test -s "$body"
            if [ -n "$expected" ]; then
              grep -qi "$expected" "$body"
            fi
            rm -f "$body"
          }
          check_url "/" "<title>"
          check_url "/sitemap.xml" "<urlset"
          check_url "/robots.txt" "Sitemap:"
          check_url "/tools/batch-image-compressor/" "<title>"
          check_url "/tools/batch-image-resizer/" "<title>"
