<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="How the QR code generator works"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b263b"/><stop offset="1" stop-color="#415a77"/></linearGradient></defs><rect width="1200" height="800" fill="url(#bg)"/><text x="600" y="110" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">QR Code in 3 Steps</text><g><rect x="60" y="250" width="320" height="220" rx="24" fill="#ffffff"/><text x="220" y="342" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">1. PASTE</text><text x="220" y="400" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">a link or text</text></g><line x1="380" y1="360" x2="440" y2="360" stroke="#14213d" stroke-width="10" stroke-linecap="round"/><polygon points="440,360 412,342 412,378" fill="#14213d"/><g><rect x="440" y="250" width="320" height="220" rx="24" fill="#ffffff"/><text x="600" y="342" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">2. GENERATE</text><text x="600" y="400" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">in your browser</text></g><line x1="760" y1="360" x2="820" y2="360" stroke="#14213d" stroke-width="10" stroke-linecap="round"/><polygon points="820,360 792,342 792,378" fill="#14213d"/><g><rect x="820" y="250" width="320" height="220" rx="24" fill="#ffd166"/><text x="980" y="342" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">3. SCAN</text><text x="980" y="400" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">with any phone</text></g><g fill="#ffffff"><rect x="520" y="540" width="160" height="160" rx="12"/><rect x="540" y="560" width="40" height="40" fill="#14213d"/><rect x="620" y="560" width="40" height="40" fill="#14213d"/><rect x="540" y="640" width="40" height="40" fill="#14213d"/><rect x="580" y="600" width="40" height="40" fill="#14213d"/><rect x="620" y="640" width="40" height="40" fill="#14213d"/></g><text x="830" y="600" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">Your code never</text><text x="830" y="650" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" text-anchor="middle">leaves your device</text></svg>