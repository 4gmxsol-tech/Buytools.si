<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="JSON formatting before and after"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#64748b"/></linearGradient></defs><rect width="1200" height="800" fill="url(#bg)"/><text x="600" y="110" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">Messy JSON, Clean JSON</text><rect x="70" y="220" width="480" height="260" rx="16" fill="#0f172a"/><text x="100" y="290" font-family="monospace" font-size="30" fill="#f87171">{"name":"ada",</text><text x="100" y="340" font-family="monospace" font-size="30" fill="#f87171">"age":36,"tags":</text><text x="100" y="390" font-family="monospace" font-size="30" fill="#f87171">["dev","ops"]}</text><line x1="550" y1="350" x2="650" y2="350" stroke="#14213d" stroke-width="10" stroke-linecap="round"/><polygon points="650,350 622,332 622,368" fill="#14213d"/><rect x="650" y="220" width="480" height="260" rx="16" fill="#ffffff"/><text x="680" y="280" font-family="monospace" font-size="28" fill="#14213d">{</text><text x="700" y="325" font-family="monospace" font-size="28" fill="#14213d">"name": "ada",</text><text x="700" y="370" font-family="monospace" font-size="28" fill="#14213d">"age": 36,</text><text x="700" y="415" font-family="monospace" font-size="28" fill="#14213d">"tags": ["dev", "ops"]</text><text x="680" y="455" font-family="monospace" font-size="28" fill="#14213d">}</text><text x="600" y="580" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">Paste JSON, get indented, validated JSON back</text><text x="600" y="640" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">Syntax errors shown with line and column</text></svg>